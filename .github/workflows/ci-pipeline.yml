name: CI

on:
  push:
    branches: [ "main", "staging" ]
    paths-ignore:
      - 'k8s/**'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para commitar a nova tag no repositório
      pull-requests: write # Permissão necessária para o gh pr create funcionar
      packages: write
      id-token: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir SHA curto do commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Instalar cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Definir kit de build para docker
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Logar no registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados docker
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.sha_short }}
            type=ref,event=branch

      - name: Construir e publicar imagem docker
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: app/
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assinar imagem docker publicada
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      - name: Atualizar imagem no Kustomize (Ambiente)
        run: |
          # Define o ambiente baseado na branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV_PATH="k8s/environments/prod"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENV_PATH="k8s/environments/staging"
          else
            echo "Branch não configurada para deploy."
            exit 0
          fi
          
          cd $ENV_PATH
          
          # Atualiza a tag da imagem no kustomization.yaml correspondente usando o kustomize
          # É necessário repassar a imagem em letras minúsculas caso o repositório tenha maiúsculas
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          kustomize edit set image "ghcr.io/arturjoaquim/fecaf_ambiente_devops=${IMAGE_LOWER}:${{ steps.vars.outputs.sha_short }}"

      - name: Commitar e criar PR de Kustomize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Verifica se tem alguma alteração para commitar
          if [ -n "$(git status --porcelain)" ]; then
            # Gera um nome de branch único para evitar conflitos se a pipeline rodar várias vezes
            BRANCH_NAME="update-ci-k8s-${{ github.ref_name }}-${{ steps.vars.outputs.sha_short }}"
          
            git checkout -b $BRANCH_NAME
            git add k8s/
            git commit -m "ci: Atualiza imagem do Kubernetes para a tag ${{ steps.vars.outputs.sha_short }} [skip ci]"
            git push origin $BRANCH_NAME -f
          
            # Cria o PR para a branch original (main ou staging)
            gh pr create --base ${{ github.ref_name }} --head $BRANCH_NAME --title "Atualiza tag da imagem no k8s para ${{ steps.vars.outputs.sha_short }} (${{ github.ref_name }})" --body "CI atualiza imagem do Kubernetes para o ambiente de ${{ github.ref_name }}."
          else
            echo "Nenhuma mudança no manifesto para commitar."
          fi