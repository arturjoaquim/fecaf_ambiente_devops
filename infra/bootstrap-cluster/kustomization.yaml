apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Isso força o Kustomize a injetar o namespace "argocd" em todos os recursos 
# importados e gerados por este arquivo.
namespace: argocd

resources:
  # 1 Configura as secrets de acesso aos repositórios no argocd
  - argocd-add-repos-secrets.yaml

  # 2 Cria o sync com os repos no argo cd
  - argocd-add-apps.yaml